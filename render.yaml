services:
  - type: web
    name: smartproctor-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_API_AUDIENCE
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      - key: AUTH0_MGMT_CLIENT_ID
        sync: false
      - key: AUTH0_MGMT_CLIENT_SECRET
        sync: false
      - key: AUTH0_MGMT_AUDIENCE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EVIDENCE_STORAGE
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: EVIDENCE_URL_TTL_SECONDS
        value: "3600"
      - key: EVIDENCE_RETENTION_DAYS
        value: "30"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: AI_WORKER_BASE_URL
        sync: false
      - key: AI_WORKER_TIMEOUT_SECONDS
        value: "10"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_RATE
        sync: false
      - key: LOG_HASH_SALT
        sync: false
      - key: EVENT_RETENTION_DAYS
        value: "30"

